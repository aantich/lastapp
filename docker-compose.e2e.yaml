# Disposable MariaDB for browser regressions (scripts/e2e.py, `make e2e`).
# A separate Compose project: it never touches the development `lastapp`
# project or its `mariadb-data` volume. Data lives in tmpfs and disappears when
# the container is removed. Root has an empty password, as in CI; the port is
# published on loopback only.
name: lastapp-e2e

services:
  mariadb-e2e:
    image: mariadb:12.3 # keep in sync with docker-compose.yaml and .github/workflows/checks.yml
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
    ports:
      - "127.0.0.1:${LASTAPP_E2E_DB_PORT:-33318}:3306" # loopback only
    tmpfs:
      - /var/lib/mysql
    command:
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
      - --skip-name-resolve
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 60
