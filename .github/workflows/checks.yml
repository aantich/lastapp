name: Checks
on: [push, pull_request, merge_group]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.4"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - name: Build UI and verify source contracts
        run: |
          npm ci --prefix web/admin
          npm run build --prefix web/admin
          npm run lint --prefix web/admin
          npm run typecheck --prefix web/admin
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
          python3 scripts/verify_driver.py
          python3 design/validate_schema.py --check
      - name: Backend, API and security regressions
        # Own disposable MariaDB with per-run secrets (docker-compose.yaml service
        # mariadb-test, scripts/testdb.py), exactly as `make integration` locally.
        run: |
          python3 scripts/testdb.py -race -count=1 ./...
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Browser regressions
        # Own disposable MariaDB/API/OIDC stack (docker-compose.yaml service mariadb-e2e), as locally.
        working-directory: web/admin
        run: |
          npx playwright install --with-deps chromium
          python3 ../../scripts/e2e.py
