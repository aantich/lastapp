name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
        ports:
          - 33317:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.4"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - name: Build UI and verify pinned driver
        run: |
          npm ci --prefix web/admin
          npm run build --prefix web/admin
          python3 scripts/verify_driver.py
      - name: Prepare disposable test registry
        env:
          DATABASE_CONTAINER: ${{ job.services.mariadb.id }}
        run: |
          docker exec "$DATABASE_CONTAINER" mariadb -uroot -e 'CREATE DATABASE lastapp_control CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          python3 scripts/ci_config.py .local/ci
          LASTAPP_PREPARE_FIXTURE_CONFIG="$PWD/.local/ci/migrate.json" go test ./internal/control -run '^TestPrepareFixture$' -count=1
      - name: Start local API and identity provider
        run: |
          go build -o .local/lastapp ./cmd/lastapp
          go build -o .local/devoidc ./cmd/devoidc
          .local/devoidc >.local/oidc.log 2>&1 &
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:8788/.well-known/openid-configuration >/dev/null && break; sleep .2; done
          .local/lastapp serve -config .local/ci/config.json >.local/api.log 2>&1 &
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:8787/readyz >/dev/null && break; sleep .2; done
          curl -fsS http://127.0.0.1:8787/readyz
      - name: Backend, API and security regressions
        env:
          LASTAPP_TEST_CONFIG: ${{ github.workspace }}/.local/ci/config.json
          LASTAPP_SECURITY_CONFIG: ${{ github.workspace }}/.local/ci/config.json
        run: |
          go test -race -count=1 ./...
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Browser regressions
        working-directory: web/admin
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mariadb-client
          npx playwright install --with-deps chromium
          npm run test:e2e
