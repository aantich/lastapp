# Local development infrastructure. `make dev` starts `mariadb` automatically when
# mariadbd is not installed on the host (or when LASTAPP_MARIADB=docker).
# The root password is generated by scripts/dev.py into .local/mariadb.env.
# `mariadb-e2e` (profile e2e) is the disposable browser-regression database that
# scripts/e2e.py (`make e2e`, CI) starts and removes; it has no volume.
name: lastapp

services:
  mariadb:
    image: mariadb:12.3 # keep in sync with .github/workflows/checks.yml
    env_file:
      - path: .local/mariadb.env
        required: false # absent in CI, which only uses mariadb-e2e
    ports:
      - "127.0.0.1:33317:3306" # loopback only
    volumes:
      - mariadb-data:/var/lib/mysql
    command:
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
      - --skip-name-resolve
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  mariadb-e2e:
    profiles: [e2e] # never started by a plain `docker compose up`
    image: mariadb:12.3
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1" # as in CI; loopback only, data in tmpfs
    ports:
      - "127.0.0.1:${LASTAPP_E2E_DB_PORT:-33318}:3306"
    tmpfs:
      - /var/lib/mysql
    command:
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
      - --skip-name-resolve
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  mariadb-data:
