# Local development infrastructure. `make dev` starts `mariadb` automatically when
# mariadbd is not installed on the host (or when LASTAPP_MARIADB=docker).
# The root password is generated by scripts/dev.py into .local/mariadb.env.
# Tests never use it. Profile `test` holds the disposable test databases (tmpfs,
# no volume) that scripts/testdb.py starts and removes: `mariadb-test` for the Go
# database tests (`make integration`, `make mcp-test`, CI) and `mariadb-e2e` for
# the browser regressions (scripts/e2e.py). Their ports are chosen in those scripts.
name: lastapp

x-disposable-mariadb: &disposable-mariadb
  profiles: [test] # never started by a plain `docker compose up`
  image: mariadb:12.3 # keep in sync with the development service above
  environment:
    MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1" # loopback only, data in tmpfs
  tmpfs:
    - /var/lib/mysql
  command:
    - --innodb-buffer-pool-size=64M
    - --performance-schema=OFF
    - --skip-name-resolve
  healthcheck:
    test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
    interval: 2s
    timeout: 5s
    retries: 60

services:
  mariadb:
    image: mariadb:12.3 # keep in sync with x-disposable-mariadb
    env_file:
      - path: .local/mariadb.env
        required: false # absent in CI, which only uses the disposable services
    ports:
      - "127.0.0.1:33317:3306" # loopback only
    volumes:
      - mariadb-data:/var/lib/mysql
    command:
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
      - --skip-name-resolve
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  mariadb-test:
    <<: *disposable-mariadb
    ports:
      - "127.0.0.1:${LASTAPP_TEST_DB_PORT:-33319}:3306"

  mariadb-e2e:
    <<: *disposable-mariadb
    ports:
      - "127.0.0.1:${LASTAPP_E2E_DB_PORT:-33318}:3306"

volumes:
  mariadb-data:
