# Local development infrastructure. `make dev` starts it automatically when
# mariadbd is not installed on the host (or when LASTAPP_MARIADB=docker).
# The root password is generated by scripts/dev.py into .local/mariadb.env.
name: lastapp

services:
  mariadb:
    image: mariadb:12.3 # keep in sync with .github/workflows/checks.yml
    env_file: .local/mariadb.env
    ports:
      - "127.0.0.1:33317:3306" # loopback only
    volumes:
      - mariadb-data:/var/lib/mysql
    command:
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
      - --skip-name-resolve
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mariadb-data:
